<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Greene County Open</title>
<meta name="theme-color" content="#0a1d37">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0a1d37; --navy2:#13294b; --accent:#c8102e; --gold:#d4a74a;
  --bg:#f2f4f7; --card:#ffffff; --line:#e3e7ed; --text:#0f1722; --muted:#6b7686;
  --under:#c8102e; --sgpos:#14864a; --sgneg:#c8102e; --chip:#e9edf3; --rowhover:#f7f9fb;
  --birdie:#c8102e; --bogey:#2b5ea7;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b111b; --card:#141c28; --line:#253041; --text:#eef2f7; --muted:#8e9bb0;
    --under:#ff5a6e; --sgpos:#3ccf7f; --sgneg:#ff5a6e; --chip:#1f2a3a; --rowhover:#1a2433;
    --birdie:#ff5a6e; --bogey:#6aa0ff;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;font-size:15px}
.wrap{max-width:680px;margin:0 auto;min-height:100vh;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* Header */
header{background:linear-gradient(180deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;padding:16px 16px 0;position:sticky;top:0;z-index:20}
.toprow{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:50%;background:#fff;color:var(--navy);display:grid;place-items:center;font-family:'Barlow Condensed',Inter,sans-serif;font-weight:700;font-size:17px;letter-spacing:.5px;flex:none;box-shadow:0 0 0 2px var(--gold)}
.ttl h1{font-size:19px;font-weight:800;letter-spacing:-.2px}
.ttl p{font-size:12.5px;opacity:.75;margin-top:2px}
.status{margin-left:auto;text-align:right;font-size:11px;opacity:.9;flex:none;white-space:nowrap}
.ttl{min-width:0}
.live{display:inline-flex;align-items:center;gap:6px;background:var(--accent);padding:3px 8px;border-radius:4px;font-weight:700;font-size:11px;letter-spacing:.6px}
.live.final{background:#ffffff26}
.live i{width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.4s infinite}
.live.final i{display:none}
@keyframes pulse{50%{opacity:.25}}
.upd{margin-top:5px;opacity:.65}
.yearsel{margin-top:6px;font:inherit;font-size:12px;font-weight:700;color:#fff;background:#ffffff1f;border:1px solid #ffffff40;border-radius:6px;padding:3px 22px 3px 8px;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,#fff 50%),linear-gradient(135deg,#fff 50%,transparent 50%);background-position:calc(100% - 11px) 50%,calc(100% - 7px) 50%;background-size:4px 4px;background-repeat:no-repeat;cursor:pointer}
.yearsel option{color:#000}
nav.tabs{display:flex;margin-top:14px}
nav.tabs button{flex:1;padding:11px 0 12px;font-size:13.5px;font-weight:600;color:#ffffffa8;border-bottom:3px solid transparent}
nav.tabs button.on{color:#fff;border-bottom-color:var(--accent)}

/* Controls */
.controls{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:var(--hdr,128px);z-index:15}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:7px 13px;border-radius:999px;background:var(--chip);font-size:13px;font-weight:600}
.chip.on{background:var(--navy);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.on{background:#fff;color:var(--navy)}}
.search{padding:0 16px 10px}
.search input{width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:14px}

.demo{margin:10px 16px 0;padding:9px 12px;border-radius:8px;background:#fff6dd;color:#6a4e00;font-size:12.5px;line-height:1.4}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .demo{background:#3a2f12;color:#f3d98b}}

/* Leaderboard */
.sect{padding:14px 16px 6px;font-size:11.5px;font-weight:700;letter-spacing:.8px;color:var(--muted);text-transform:uppercase;display:flex;justify-content:space-between}
.lb{background:var(--card)}
.lbh,.row{display:grid;grid-template-columns:48px 1fr 58px 50px 58px;align-items:center}
.lbh{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.5px;padding:8px 16px 8px 8px;border-bottom:1px solid var(--line);background:var(--card)}
.lbh span:not(:nth-child(2)){text-align:center}
.row{padding:0 16px 0 8px;min-height:54px;border-bottom:1px solid var(--line);cursor:pointer}
.row:hover{background:var(--rowhover)}
.row.open{background:var(--rowhover)}
.pos{text-align:center;font-weight:700;font-size:14px;color:var(--muted)}
.pname{display:flex;align-items:center;gap:8px;min-width:0}
.pn{display:flex;flex-direction:column;min-width:0;gap:2px}
.pn .ftag{align-self:flex-start;font-size:9.5px;padding:1px 5px}
.ftag.po{background:#d4a74a33;color:#8a6414}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ftag.po{color:#f0cd7c}}
.star{font-size:17px;line-height:1;color:var(--line);padding:4px 2px;flex:none}
.star.on{color:var(--gold)}
.nm{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ftag{font-size:10px;font-weight:700;color:var(--muted);background:var(--chip);padding:2px 6px;border-radius:4px;flex:none;letter-spacing:.3px}
.num{text-align:center;font-family:'Barlow Condensed',Inter,sans-serif;font-size:19px;font-weight:700}
.thru{text-align:center;font-size:13px;color:var(--muted);font-weight:600}
.today{text-align:center;font-size:14px;font-weight:600}
.u{color:var(--under)}
.cut{padding:7px 16px;font-size:11px;font-weight:700;letter-spacing:.6px;color:var(--muted);background:var(--bg);text-align:center;border-bottom:1px solid var(--line)}

/* Scorecard */
.card{padding:4px 12px 16px;background:var(--rowhover);border-bottom:1px solid var(--line)}
.rtabs{display:flex;gap:6px;margin:6px 4px 10px}
.rtabs button{padding:5px 12px;border-radius:6px;font-size:12.5px;font-weight:600;background:var(--chip)}
.rtabs button.on{background:var(--navy);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .rtabs button.on{background:#fff;color:var(--navy)}}
.sc{width:100%;border-collapse:collapse;table-layout:fixed;background:var(--card);border-radius:8px;overflow:hidden;margin-bottom:8px;font-size:12.5px}
.sc td{text-align:center;padding:6px 0;border-bottom:1px solid var(--line)}
.sc tr:last-child td{border-bottom:0}
.sc td:first-child{text-align:left;padding-left:8px;font-weight:700;color:var(--muted);width:44px;font-size:11px}
.sc tr.hole td{background:var(--navy);color:#fff;font-weight:700}
.sc tr.hole td:first-child{color:#ffffffb0}
.sc td.tot{font-weight:700;background:var(--chip)}
.sc tr.hole td.tot{background:#24395c;color:#fff}
.s{display:inline-grid;place-items:center;width:22px;height:22px;font-weight:700;font-size:12.5px}
.s.b{border:1.5px solid var(--birdie);border-radius:50%;color:var(--birdie)}
.s.e{border:1.5px solid var(--birdie);border-radius:50%;color:var(--birdie);box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--birdie)}
.s.bo{border:1.5px solid var(--bogey);color:var(--bogey)}
.s.db{border:1.5px solid var(--bogey);color:var(--bogey);box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--bogey)}
.sg{font-size:10.5px;font-weight:700}
.yd{font-size:10px;color:var(--muted)}
.pos-sg{color:var(--sgpos)} .neg-sg{color:var(--sgneg)}
.note{background:var(--card);border-radius:8px;padding:14px;font-size:13.5px;color:var(--muted);line-height:1.45;margin:0 0 4px}
.note b{color:var(--text);font-size:15px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:4px}
.stat{background:var(--card);border-radius:8px;padding:8px 4px;text-align:center}
.stat b{display:block;font-family:'Barlow Condensed',Inter,sans-serif;font-size:20px}
.stat span{font-size:10.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}

/* SG + Course tables */
.explain{margin:12px 16px 4px;padding:12px 14px;background:var(--card);border-radius:10px;font-size:13px;line-height:1.5;color:var(--muted);border:1px solid var(--line)}
.explain b{color:var(--text)}
.sgh,.sgr{display:grid;grid-template-columns:40px 1fr 58px 46px 46px 46px;align-items:center}
.sgh{font-size:10.5px;font-weight:700;color:var(--muted);padding:8px 12px 8px 4px;border-bottom:1px solid var(--line);background:var(--card);letter-spacing:.4px}
.sgh span:not(:nth-child(2)){text-align:center}
.sgr{padding:0 12px 0 4px;min-height:50px;border-bottom:1px solid var(--line);background:var(--card)}
.sgv{text-align:center;font-weight:700;font-size:13.5px}
.sgtot{text-align:center}
.pill{display:inline-block;min-width:48px;padding:4px 6px;border-radius:6px;font-weight:800;font-size:14px;font-family:'Barlow Condensed',Inter,sans-serif;font-size:17px}
.pill.p{background:#14864a1f;color:var(--sgpos)} .pill.n{background:#c8102e1a;color:var(--sgneg)}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%}
.sub{font-size:11px;color:var(--muted);font-weight:500}

.ch,.cr{display:grid;grid-template-columns:34px 30px 40px 44px 50px 36px 1fr;align-items:center;gap:4px}
@media (max-width:360px){.ch,.cr{padding-left:10px!important;padding-right:10px!important}}
.ch{font-size:10.5px;font-weight:700;color:var(--muted);padding:8px 16px;border-bottom:1px solid var(--line);background:var(--card);letter-spacing:.4px}
.cr{padding:10px 16px;border-bottom:1px solid var(--line);background:var(--card);font-size:14px}
.cr > *:not(:last-child){text-align:center}
.dist{display:flex;height:12px;border-radius:3px;overflow:hidden}
.dist i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;padding:10px 16px;font-size:11px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}

.empty{padding:40px 16px;text-align:center;color:var(--muted)}
footer{padding:24px 16px 40px;text-align:center;font-size:11.5px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header id="hdr">
    <div class="toprow">
      <div class="logo">GCO</div>
      <div class="ttl"><h1 id="title">Greene County Open</h1><p id="subtitle"></p></div>
      <div class="status"><span class="live" id="live"><i></i><span id="liveTxt">LIVE</span></span><div class="upd" id="upd"></div><select id="year" class="yearsel" aria-label="Year"></select></div>
    </div>
    <nav class="tabs" id="tabs">
      <button data-tab="lb" class="on">Leaderboard</button>
      <button data-tab="sg">Strokes Gained</button>
      <button data-tab="course">Course</button>
    </nav>
  </header>
  <div class="controls" id="controls">
    <div class="chips" id="chips"></div>
    <div class="search" id="searchBox"><input id="q" type="search" placeholder="Search players" autocomplete="off"></div>
  </div>
  <main id="main"></main>
  <footer>Tap a player for their scorecard · Updates every minute</footer>
</div>

<script>
/* =====================================================================
   CONFIG — the only part that needs editing each year
   ===================================================================== */
const CONFIG = {
  title: "Greene County Open",
  course: "Phil Harris Golf Course",
  roundNames: ["Saturday","Sunday"],
  // One entry per year, newest last. Each year is its own tab in the Google Sheet,
  // published as CSV (File → Share → Publish to web → pick that tab → CSV).
  // The newest year with a link opens by default and refreshes live; older years are archives.
  years: [
    { year: 2026, dates: "July 2026", url: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSYmkDz0Iq3RYsHnsbLyAem77_d66PBhyvuPGyB4okOrgwV39YlVuCQWl7AWTbYTyuR42XXz3Gp4p-R/pub?gid=1264024970&single=true&output=csv" },
  ],
  refreshSeconds: 60,
  rounds: 2,
  // Fallback pars (used only if the sheet has no PAR row)
  pars:  [3,4,4,4,5,5,3,4,3,  3,4,5,4,3,5,4,4,4],
  yards: [151,366,354,401,572,480,160,315,208,  114,344,454,389,130,573,338,336,328],
  // Flights are placed by Saturday (Round 1) gross score, within each division.
  // division: "" = men's field, "Senior", "Ladies" (matches the sheet's Division column).
  // maxR1 = highest Saturday score allowed in that flight. The last flight in each division
  // takes everyone left over, so its maxR1 doesn't matter.
  // Flights stay hidden until flightsReady is true (set it once cutoffs are filled in).
  // A "Flight" column in the sheet overrides the placement for any individual player.
  flightsReady: false,
  flights: [
    { name:"Championship",        short:"Champ",      division:"",       maxR1:null },
    { name:"A",                   short:"A",          division:"",       maxR1:null },
    { name:"B",                   short:"B",          division:"",       maxR1:null },
    { name:"C",                   short:"C",          division:"",       maxR1:null },
    { name:"D",                   short:"D",          division:"",       maxR1:null },
    { name:"Senior Championship", short:"Sr Champ",   division:"Senior", maxR1:null },
    { name:"Senior A",            short:"Sr A",       division:"Senior", maxR1:null },
    { name:"Ladies Championship", short:"Lad Champ",  division:"Ladies", maxR1:null },
    { name:"Ladies A",            short:"Lad A",      division:"Ladies", maxR1:null }
  ]
};

/* ===================================================================== */
const YEARS = CONFIG.years.filter(y=>y.url);
const DEMO = !YEARS.length;
const latestYear = YEARS.length? YEARS[YEARS.length-1].year : null;
const $ = s => document.querySelector(s);
const state = { year:(()=>{ const q=+new URLSearchParams(location.search).get("year"); return YEARS.some(y=>y.year===q)? q : latestYear; })(), tab:"lb", flight:null, sgRound:"all", courseRound:"all", open:new Set(), cardRound:{}, q:"", favs:loadFavs(), d:null };

function loadFavs(){ try{ return new Set(JSON.parse(localStorage.getItem("gco_favs")||"[]")); }catch(e){ return new Set(); } }
function saveFavs(){ try{ localStorage.setItem("gco_favs", JSON.stringify([...state.favs])); }catch(e){} }

/* ---------- CSV ---------- */
function parseCSV(t){
  const rows=[]; let row=[], cell="", q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){ if(c=='"'){ if(t[i+1]=='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c=='"') q=true;
    else if(c==','){ row.push(cell); cell=""; }
    else if(c=='\n'||c=='\r'){ if(c=='\r'&&t[i+1]=='\n') i++; row.push(cell); rows.push(row); row=[]; cell=""; }
    else cell+=c;
  }
  if(cell!==""||row.length){ row.push(cell); rows.push(row); }
  return rows;
}

/* ---------- Demo data ---------- */
function demoRows(){
  let seed=7; const rnd=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };
  const first=["Jake","Tyler","Brandon","Matt","Kyle","Cody","Josh","Ryan","Derek","Chad","Nick","Travis","Luke","Grant","Zach","Blake","Mitch","Drew","Evan","Cole","Shane","Brett","Dustin","Garrett","Wes","Seth","Adam","Trent","Jared","Logan","Chris","Aaron","Dan","Ben","Sam","Tim","Craig","Jeff","Randy","Doug"];
  const last=["Miller","Harris","Cooper","Walsh","Bennett","Reed","Fowler","Sutton","Barnes","Hale","Pruitt","Crane","Lambert","Moss","Fisher","Holt","Dalton","Keene","Rhodes","Pierce","Gentry","Lyle","Rowe","Shaw","Vance","Wade","Yates","Boone","Carver","Dixon","Ellis","Frye","Graves","Hurst","Ingram","Jett","Kline","Lowe","Marsh","Nolan"];
  const pars=CONFIG.pars, rows=[["Player","Round",...pars.map((_,i)=>String(i+1))]];
  rows.push(["PAR","",...pars.map(String)]);
  for(let p=0;p<40;p++){
    const name=first[p]+" "+last[(p*7)%40];
    const skill=-0.05+p*0.02+rnd()*0.15;                 // avg strokes over par per hole
    const thru2 = p%9===0?0 : p%5===0?18 : p%3===0? 9+Math.floor(rnd()*7) : (p%2? 18 : 12+Math.floor(rnd()*6));
    for(let r=1;r<=2;r++){
      const n = r===1?18:thru2; const hs=[];
      for(let h=0;h<18;h++){
        if(h>=n){ hs.push(""); continue; }
        let x=rnd(), d;
        const diff = skill + (h===3||h===12? -0.25:0) + (h===8||h===16? 0.25:0);
        if(x<0.012) d=-2; else if(x<0.18-diff*0.12) d=-1; else if(x<0.62-diff*0.35) d=0; else if(x<0.9-diff*0.1) d=1; else if(x<0.97) d=2; else d=3;
        if(pars[h]===3 && d===-2) d=-1;
        hs.push(String(pars[h]+d));
      }
      rows.push([name,String(r),...hs]);
    }
  }
  return rows;
}

/* ---------- Build model ---------- */
function build(rows){
  const hdr=rows[0].map(s=>s.trim().toLowerCase());
  const iP=hdr.indexOf("player"), iR=hdr.indexOf("round"), iF=hdr.indexOf("flight"), iD=hdr.indexOf("division"), iX=hdr.findIndex(h=>/^(finish|place|playoff|pos)/.test(h)), iS=hdr.findIndex(h=>h==="round score"||h==="round total");
  const iH=[]; for(let h=1;h<=18;h++) iH.push(hdr.indexOf(String(h)));
  let pars=CONFIG.pars.slice();
  const map=new Map();
  for(const r of rows.slice(1)){
    const name=(r[iP]||"").trim(); if(!name) continue;
    const vals=iH.map(i=>{ const v=parseInt((r[i]||"").trim(),10); return isNaN(v)?null:v; });
    if(name.toUpperCase()==="PAR"){ pars=vals.map((v,i)=>v??pars[i]); continue; }
    const rd=parseInt(r[iR],10)||1;
    if(!map.has(name)) map.set(name,{name, fo:"", div:"", rounds:{}});
    const pl=map.get(name);
    if(iF>=0 && (r[iF]||"").trim()) pl.fo=r[iF].trim();
    if(iD>=0 && (r[iD]||"").trim()) pl.div=normDiv(r[iD]);
    if(iX>=0){ const fx=parseInt(String(r[iX]||"").replace(/[^0-9]/g,""),10); if(fx>0) pl.finish=fx; }  // playoff / tiebreak finish within the flight
    pl.rounds[rd]=vals;
    // a round with no hole scores can still carry its total (or NR = not recorded) in a "Round Score" column
    if(iS>=0 && vals.every(v=>v==null)){ const rs=String(r[iS]||"").trim(); if(/^\d+$/.test(rs)) (pl.manual=pl.manual||{})[rd]=+rs; else if(/^n\/?r$/i.test(rs)) pl.nr=true; }
    if(iH.some(i=>(r[i]||"").trim().toUpperCase()==="WD")) pl.wd=true;
  }
  const players=[...map.values()];
  const R=CONFIG.rounds;
  for(const p of players){ for(let r=1;r<=R;r++) if(!p.rounds[r]) p.rounds[r]=Array(18).fill(null); }

  // current round = highest round with any score
  let cur=1; for(const p of players) for(let r=1;r<=R;r++) if(p.rounds[r].some(v=>v!=null) || (p.manual&&p.manual[r])) cur=Math.max(cur,r);

  // pass 1: scoring per player/round, then flights (flights need Round 1 totals)
  for(const p of players){
    p.toPar=0; p.holes=0; p.strokes=0; p.r={};
    for(let r=1;r<=R;r++){
      const sc=p.rounds[r]; let tp=0,st=0,n=0, cats={e:0,b:0,p:0,bo:0,db:0};
      sc.forEach((v,h)=>{ if(v==null) return; n++; st+=v; const d=v-pars[h]; tp+=d;
        if(d<=-2)cats.e++; else if(d===-1)cats.b++; else if(d===0)cats.p++; else if(d===1)cats.bo++; else cats.db++; });
      if(n===0 && p.manual && p.manual[r]){ const ms=p.manual[r]; tp=ms-pars.reduce((a,b)=>a+b,0); st=ms; n=18; }
      p.r[r]={toPar:tp, strokes:st, thru:n, sg:0, sgN:0, sgT:{3:0,4:0,5:0}, cats, manual:!!(p.manual&&p.manual[r]&&!sc.some(v=>v!=null))};
      p.toPar+=tp; p.holes+=n; p.strokes+=st;
    }
    p.today=p.r[cur];
    p.flight = p.fo ? ((CONFIG.flights.find(x=>x.name.toLowerCase()===p.fo.toLowerCase())||{}).name||p.fo) : flightFor(p);
  }

  // hole averages per group (whole field "ALL" + each flight) per round
  const groups={ALL:players};
  for(const p of players) if(p.flight) (groups[p.flight]=groups[p.flight]||[]).push(p);
  const avg={}, cnt={};
  for(const g in groups){ avg[g]={}; cnt[g]={};
    for(let r=1;r<=R;r++){ avg[g][r]=[]; cnt[g][r]=[];
      for(let h=0;h<18;h++){ let s=0,n=0; for(const p of groups[g]){ const v=p.rounds[r][h]; if(v!=null){s+=v;n++;} }
        avg[g][r][h]=n?s/n:null; cnt[g][r][h]=n; } } }

  // pass 2: strokes gained vs the player's flight (vs whole field until flights are set)
  for(const p of players){
    p.base = p.flight || "ALL";
    for(let r=1;r<=R;r++){ const x=p.r[r];
      p.rounds[r].forEach((v,h)=>{ if(v==null||cnt[p.base][r][h]<2) return;
        const g=avg[p.base][r][h]-v; x.sg+=g; x.sgN++; x.sgT[pars[h]]+=g; }); }
  }
  return {players, pars, cur, avg, cnt, R};
}
function flightFor(p){
  if(!CONFIG.flightsReady) return "";
  const f=CONFIG.flights.filter(x=>x.division===p.div); if(!f.length) return "";
  const r1=p.r[1]; if(r1.thru<18) return "";
  for(let i=0;i<f.length-1;i++) if(f[i].maxR1!=null && r1.strokes<=f[i].maxR1) return f[i].name;
  return f[f.length-1].name;
}
function normDiv(v){ v=(v||"").trim().toLowerCase(); return v.startsWith("sen")?"Senior": (v.startsWith("lad")||v.startsWith("wom"))?"Ladies":""; }

/* ---------- Helpers ---------- */
const dayShort=r=>(CONFIG.roundNames[r-1]||"RD "+r).slice(0,3).toUpperCase();
const fmtPar=v=> v===0?"E": v>0?"+"+v: String(v);
const fmtSG=v=> (v>0?"+":"")+v.toFixed(2);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function rank(list,key){ // returns positions with ties: "T3"
  const out=new Map(); let i=0;
  while(i<list.length){ let j=i; while(j+1<list.length && key(list[j+1])===key(list[i])) j++;
    for(let k=i;k<=j;k++) out.set(list[k], (j>i?"T":"")+(i+1)); i=j+1; }
  return out;
}
function flightNames(){
  const d=state.d; const names=CONFIG.flights.map(f=>f.name);
  for(const p of d.players) if(p.flight && !names.includes(p.flight)) names.push(p.flight);
  return names.filter(n=>d.players.some(p=>p.flight===n));
}
function filtered(){
  const d=state.d; let ps=d.players;
  if(state.flight!=="All") ps=ps.filter(p=>p.flight===state.flight);
  return ps;
}

/* ---------- Render ---------- */
function render(){
  const d=state.d; if(!d) return;
  if(!state.flightPicked){ const f=flightNames(); state.flight=f.length?f[0]:"All"; }  // open on the top flight once flights are set
  // header status
  const allDone = d.cur===d.R && d.players.every(p=>p.r[d.R].thru===18 || p.holes===0 || p.wd || p.nr);
  const anyLive = d.players.some(p=>p.today.thru>0 && p.today.thru<18);
  $("#live").className="live"+(allDone||!anyLive?" final":"");
  const archive = !DEMO && state.year!==latestYear;
  if(archive) $("#live").className="live final";
  $("#liveTxt").textContent= archive||allDone? "FINAL" : anyLive? "LIVE · "+dayShort(d.cur) : dayShort(d.cur)+" FINAL";
  $("#upd").textContent= archive? "Final results" : "Updated "+new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});

  // chips
  const fl=flightNames();
  let chips="";
  if(state.tab==="lb"||state.tab==="sg"){
    if(fl.length){ chips=[...fl,"All"].map(f=>`<button class="chip ${state.flight===f?"on":""}" data-flight="${esc(f)}">${f==="All"?"Overall":esc(abbr(f))}</button>`).join(""); }
    else chips=`<button class="chip on">Overall</button><span class="chip" style="opacity:.6;font-weight:500">Flights set after Saturday</span>`;
  }
  if(state.tab==="sg"||state.tab==="course"){
    const k=state.tab==="sg"?"sgRound":"courseRound";
    const rs=["all",...Array.from({length:d.cur},(_,i)=>String(i+1))];
    chips += `<span style="width:1px;background:var(--line);flex:none;margin:0 2px"></span>` +
      rs.map(r=>`<button class="chip ${state[k]===r?"on":""}" data-rnd="${r}" data-k="${k}">${r==="all"?"Both Days":(CONFIG.roundNames[r-1]||"Rd "+r)}</button>`).join("");
  }
  $("#chips").innerHTML=chips;
  $("#searchBox").style.display= state.tab==="course"?"none":"";

  $("#main").innerHTML = (DEMO?`<div class="demo"><b>Demo data.</b> Connect your Google Sheet in CONFIG to go live. Demo flights shown so you can preview the layout.</div>`:"") +
    (state.tab==="lb"?renderLB(): state.tab==="sg"?renderSG(): renderCourse());
  document.documentElement.style.setProperty("--hdr", $("#hdr").offsetHeight+"px");
}

function renderLB(){
  const d=state.d; const q=state.q.toLowerCase();
  const ps=filtered().slice().sort((a,b)=> (!!(a.wd||a.nr))-(!!(b.wd||b.nr)) || (b.holes>0)-(a.holes>0) || a.toPar-b.toPar || (b.finish===1)-(a.finish===1) || b.holes-a.holes || a.name.localeCompare(b.name));
  const started=ps.filter(p=>p.holes>0 && !p.wd && !p.nr);
  const pos=rank(started,p=>p.toPar);
  // Playoffs decide first place only: when players tie for the lead and one has Finish = 1,
  // that player is 1st and the others in the playoff are 2nd (T2 if more than one). Other ties stay ties.
  const po=new Map();
  if(state.flight!=="All" && started.length>1){
    let j=0; while(j+1<started.length && started[j+1].toPar===started[0].toPar) j++;
    const grp=started.slice(0,j+1), win=grp.find(p=>p.finish===1);
    if(grp.length>1 && win){
      const rest=grp.filter(p=>p!==win);
      pos.set(win,"1"); po.set(win,"Won playoff");
      rest.forEach(p=>{ pos.set(p, rest.length>1?"T2":"2"); po.set(p,"Lost playoff"); });
    }
  }
  state._po=po;
  const shown=ps.filter(p=>!q||p.name.toLowerCase().includes(q));
  if(!shown.length) return `<div class="empty">No players found.</div>`;
  const favs=shown.filter(p=>state.favs.has(p.name));
  const head=`<div class="lbh"><span>POS</span><span>PLAYER</span><span>TOT</span><span>THRU</span><span>${dayShort(d.cur)}</span></div>`;
  let html="";
  if(favs.length && !q) html+=`<div class="sect"><span>★ My Players</span></div><div class="lb">${head}${favs.map(p=>rowHTML(p,pos,"f")).join("")}</div>`;
  html+=`<div class="sect"><span>${state.flight==="All"?"Overall":esc(state.flight)+" Flight"}</span><span>${started.length} player${started.length===1?"":"s"}</span></div><div class="lb">${head}`;
  html+=shown.map(p=>rowHTML(p,pos,"m")).join("");
  return html+"</div>";
}
function rowHTML(p,pos,ctx){
  const d=state.d, t=p.today, key=ctx+"|"+p.name, open=state.open.has(key);
  const thru= p.wd? "WD" : p.nr? "—" : t.thru===18?"F": t.thru===0? "—" : t.thru;
  const showTag = state.flight==="All" && p.flight;
  let h=`<div class="row ${open?"open":""}" data-key="${esc(key)}">
    <div class="pos">${p.wd?"WD":p.nr?"—":p.holes?pos.get(p)||"":"—"}</div>
    <div class="pname"><button class="star ${state.favs.has(p.name)?"on":""}" data-fav="${esc(p.name)}" aria-label="Favorite">★</button><span class="pn"><span class="nm">${esc(p.name)}</span>${showTag?`<span class="ftag">${esc(abbr(p.flight).toUpperCase())}</span>`:""}${state._po&&state._po.get(p)?`<span class="ftag po">${state._po.get(p).toUpperCase()}</span>`:""}${p.nr?`<span class="ftag">${esc(nrLabel(p))}</span>`:""}</span></div>
    <div class="num ${p.toPar<0?"u":""}">${p.holes?fmtPar(p.toPar):"—"}</div>
    <div class="thru">${thru}</div>
    <div class="today ${t.toPar<0?"u":""}">${t.thru?fmtPar(t.toPar):"—"}</div>
  </div>`;
  if(open) h+=cardHTML(p,key);
  return h;
}
function nrLabel(p){ const d=state.d; for(let r=1;r<=d.R;r++) if(!p.r[r].thru) return ((CONFIG.roundNames[r-1]||"Round "+r)+" not recorded").toUpperCase(); return "NOT RECORDED"; }
function abbr(f){ const c=CONFIG.flights.find(x=>x.name.toLowerCase()===f.toLowerCase()); return c&&c.short? c.short : f; }

function cardHTML(p,key){
  const d=state.d;
  let r=state.cardRound[key] || (p.today.thru? d.cur : (p.r[1].thru? 1: d.cur));
  const tabs=Array.from({length:d.R},(_,i)=>i+1).filter(x=>x<=d.cur).map(x=>`<button class="${x==r?"on":""}" data-cr="${x}" data-key="${esc(key)}">${CONFIG.roundNames[x-1]||"Round "+x}</button>`).join("");
  const sc=p.rounds[r], st=p.r[r];
  const nine=(a,b,label)=>{
    let hole="",par="",yds="",sco="",sg=""; let ps=0,ys=0,ss=0,sgs=0,sgc=0,any=false;
    for(let h=a;h<b;h++){
      const v=sc[h], pr=d.pars[h]; ps+=pr;
      hole+=`<td>${h+1}</td>`; par+=`<td>${pr}</td>`; const y=CONFIG.yards[h]||0; ys+=y; yds+=`<td class="yd">${y||""}</td>`;
      if(v==null){ sco+=`<td>·</td>`; sg+=`<td></td>`; continue; }
      any=true; ss+=v; const df=v-pr;
      const cls= df<=-2?"e": df===-1?"b": df===1?"bo": df>=2?"db":"";
      sco+=`<td><span class="s ${cls}">${v}</span></td>`;
      if(d.cnt[p.base][r][h]>=2){ const g=d.avg[p.base][r][h]-v; sgs+=g; sgc++; sg+=`<td class="sg ${g>=0?"pos-sg":"neg-sg"}">${(g>0?"+":"")+g.toFixed(1)}</td>`; } else sg+=`<td></td>`;
    }
    return `<table class="sc"><tr class="hole"><td>HOLE</td>${hole}<td class="tot">${label}</td></tr>
      <tr><td>YDS</td>${yds}<td class="tot yd">${ys||""}</td></tr>
      <tr><td>PAR</td>${par}<td class="tot">${ps}</td></tr>
      <tr><td>SCORE</td>${sco}<td class="tot">${any?ss:"—"}</td></tr>
      <tr><td>SG</td>${sg}<td class="tot sg ${sgs>=0?"pos-sg":"neg-sg"}">${sgc?(sgs>0?"+":"")+sgs.toFixed(1):""}</td></tr></table>`;
  };
  const c=st.cats;
  const dayName=CONFIG.roundNames[r-1]||"Round "+r;
  if(st.manual) return `<div class="card"><div class="rtabs">${tabs}</div><div class="note">${dayName}: <b>${st.strokes}</b> (${fmtPar(st.toPar)}). Hole-by-hole scores weren't recorded for this round.</div></div>`;
  if(!st.thru && p.nr) return `<div class="card"><div class="rtabs">${tabs}</div><div class="note">${dayName} score wasn't recorded.</div></div>`;
  return `<div class="card"><div class="rtabs">${tabs}</div>${nine(0,9,"OUT")}${nine(9,18,"IN")}
    <div class="stats">
      <div class="stat"><b>${st.thru?st.strokes:"—"}</b><span>Score</span></div>
      <div class="stat"><b class="${st.sg>=0?"pos-sg":"neg-sg"}">${st.sgN?fmtSG(st.sg):"—"}</b><span>SG</span></div>
      <div class="stat"><b>${c.e+c.b}</b><span>Birdies+</span></div>
      <div class="stat"><b>${c.p}</b><span>Pars</span></div>
      <div class="stat"><b>${c.bo+c.db}</b><span>Bogeys+</span></div>
    </div></div>`;
}

function renderSG(){
  const d=state.d, q=state.q.toLowerCase();
  const rs = state.sgRound==="all"? Array.from({length:d.cur},(_,i)=>i+1) : [ +state.sgRound ];
  const rowsData = filtered().map(p=>{
    let sg=0,n=0,t={3:0,4:0,5:0};
    for(const r of rs){ const x=p.r[r]; sg+=x.sg; n+=x.sgN; for(const k of [3,4,5]) t[k]+=x.sgT[k]||0; }
    return {p,sg,n,t};
  }).filter(x=>x.n>0).sort((a,b)=>b.sg-a.sg);
  const pos=rank(rowsData,x=>x.sg.toFixed(2));
  const max=Math.max(1,...rowsData.map(x=>Math.abs(x.sg)));
  const shown=rowsData.filter(x=>!q||x.p.name.toLowerCase().includes(q));
  const cell=v=>`<div class="sgv ${v>=0.005?"pos-sg":v<=-0.005?"neg-sg":""}">${(v>0?"+":"")+v.toFixed(1)}</div>`;
  let html=`<div class="explain"><b>Strokes Gained</b> compares each score to your <b>flight's</b> average on that hole that day. Make a 4 where your flight averages 4.6 and you gain <b>+0.6</b>. Before flights are set Saturday, everyone is compared to the whole field.</div>
  <div class="sect"><span>SG: Total</span><span>${state.sgRound==="all"?"Both days":(CONFIG.roundNames[state.sgRound-1]||"Round "+state.sgRound)}</span></div>
  <div class="sgh"><span>POS</span><span>PLAYER</span><span>TOTAL</span><span>PAR 3</span><span>PAR 4</span><span>PAR 5</span></div>`;
  html+=shown.map(x=>`<div class="sgr"><div class="pos">${pos.get(x)}</div>
    <div style="min-width:0"><div class="nm">${esc(x.p.name)}</div><div class="bar"><i style="width:${Math.abs(x.sg)/max*100}%;background:${x.sg>=0?"var(--sgpos)":"var(--sgneg)"}"></i></div><div class="sub">${x.n} holes${state.flight==="All"&&x.p.flight?" · "+esc(abbr(x.p.flight)):""}</div></div>
    <div class="sgtot"><span class="pill ${x.sg>=0?"p":"n"}">${fmtSG(x.sg)}</span></div>
    ${cell(x.t[3])}${cell(x.t[4])}${cell(x.t[5])}</div>`).join("");
  return html || `<div class="empty">No scores yet.</div>`;
}

function renderCourse(){
  const d=state.d;
  const rs = state.courseRound==="all"? Array.from({length:d.cur},(_,i)=>i+1) : [ +state.courseRound ];
  const holes=d.pars.map((par,h)=>{
    let s=0,n=0,dist={e:0,b:0,p:0,bo:0,db:0};
    for(const p of d.players) for(const r of rs){ const v=p.rounds[r][h]; if(v==null) continue; s+=v;n++; const df=v-par;
      if(df<=-2)dist.e++; else if(df===-1)dist.b++; else if(df===0)dist.p++; else if(df===1)dist.bo++; else dist.db++; }
    return {h,par,avg:n?s/n:null,n,dist};
  });
  const ranked=holes.filter(x=>x.n).slice().sort((a,b)=>(b.avg-b.par)-(a.avg-a.par));
  const rk=new Map(ranked.map((x,i)=>[x.h,i+1]));
  const col={e:"#d4a74a",b:"var(--birdie)",p:"#9aa6b6",bo:"var(--bogey)",db:"#1b3a6b"};
  let html=`<div class="legend"><span><i style="background:${col.e}"></i>Eagle</span><span><i style="background:${col.b}"></i>Birdie</span><span><i style="background:${col.p}"></i>Par</span><span><i style="background:${col.bo}"></i>Bogey</span><span><i style="background:${col.db}"></i>Double+</span></div>
  <div class="ch"><span>HOLE</span><span>PAR</span><span>YDS</span><span>AVG</span><span>+/-</span><span>RANK</span><span>SCORING</span></div>`;
  html+=holes.map(x=>{ const diff=x.avg==null?null:x.avg-x.par;
    const bars= x.n? Object.keys(col).map(k=>x.dist[k]?`<i style="width:${x.dist[k]/x.n*100}%;background:${col[k]}"></i>`:"").join(""):"";
    return `<div class="cr"><b>${x.h+1}</b><span>${x.par}</span><span class="sub">${CONFIG.yards[x.h]||""}</span><span>${x.avg==null?"—":x.avg.toFixed(2)}</span>
      <span class="${diff>0?"":"u"}" style="font-weight:700">${diff==null?"—":(diff>0?"+":"")+diff.toFixed(2)}</span>
      <span style="color:var(--muted);font-weight:600">${rk.get(x.h)||"—"}</span><div class="dist">${bars}</div></div>`; }).join("");
  const tot=holes.reduce((a,x)=>a+(x.avg||0),0), parT=d.pars.reduce((a,b)=>a+b,0);
  html+=`<div class="cr" style="background:var(--chip)"><b>TOT</b><span>${parT}</span><span class="sub">${CONFIG.yards.reduce((a,b)=>a+b,0)}</span><span><b>${tot.toFixed(1)}</b></span><span style="font-weight:700">${(tot-parT>0?"+":"")+(tot-parT).toFixed(1)}</span><span></span><span class="sub">Rank 1 = hardest</span></div>`;
  return html;
}

/* ---------- Events ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("button,.row"); if(!t) return;
  if(t.dataset.tab){ state.tab=t.dataset.tab; document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b===t)); render(); window.scrollTo(0,0); return; }
  if(t.dataset.flight){ state.flight=t.dataset.flight; state.flightPicked=true; render(); return; }
  if(t.dataset.rnd){ state[t.dataset.k]=t.dataset.rnd; render(); return; }
  if(t.dataset.fav!==undefined){ e.stopPropagation(); const n=t.dataset.fav; state.favs.has(n)?state.favs.delete(n):state.favs.add(n); saveFavs(); render(); return; }
  if(t.dataset.cr){ state.cardRound[t.dataset.key]=+t.dataset.cr; render(); return; }
  if(t.classList.contains("row")){ const k=t.dataset.key; state.open.has(k)?state.open.delete(k):state.open.add(k); render(); }
});
$("#q").addEventListener("input",e=>{ state.q=e.target.value; render(); });

/* ---------- Load ---------- */
async function load(){
  try{
    let rows;
    if(DEMO){
      rows=demoRows();
    } else {
      const y=YEARS.find(x=>x.year===state.year); const want=state.year;
      const res=await fetch(y.url+(y.url.includes("?")?"&":"?")+"t="+Date.now());
      rows=parseCSV(await res.text());
      if(!rows.length || !rows[0].some(c=>c.trim().toLowerCase()==="player")) throw new Error("Sheet needs a 'Player' header in row 1");
      if(want!==state.year) return;  // year was switched while loading
    }
    state.d=build(rows); render();
  }catch(err){ console.error(err); if(!state.d) $("#main").innerHTML=`<div class="empty">Couldn't load scores. ${esc(err.message||"")}<br>Pull down to refresh.</div>`; }
}
function setHeader(){
  const y=CONFIG.years.find(x=>x.year===state.year);
  $("#subtitle").textContent=(y?y.dates:"")+" · "+CONFIG.course;
  const sel=$("#year");
  sel.innerHTML=YEARS.slice().reverse().map(x=>`<option value="${x.year}" ${x.year===state.year?"selected":""}>${x.year}</option>`).join("");
  sel.style.display= YEARS.length? "" : "none";
}
$("#year").addEventListener("change",e=>{
  state.year=+e.target.value; state.d=null; state.open.clear(); state.cardRound={}; state.flightPicked=false;
  try{ history.replaceState(null,"",state.year===latestYear? location.pathname : "?year="+state.year); }catch(err){}
  setHeader(); $("#main").innerHTML=`<div class="empty">Loading ${state.year}…</div>`; load();
});
$("#title").textContent=CONFIG.title; document.title=CONFIG.title;
setHeader(); load();
// only the newest year refreshes live; past years are final
if(!DEMO) setInterval(()=>{ if(state.year===latestYear) load(); }, CONFIG.refreshSeconds*1000);
</script>
